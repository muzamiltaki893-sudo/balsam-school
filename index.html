<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta name="theme-color" content="#142338">

  <meta
    name="description"
    content="منصة مدرسة البلسم الثانوية التعليمية"
  >

  <title>مدرسة البلسم الثانوية — تسجيل الدخول</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

  <main class="login-shell">

    <section class="login-card">

      <div class="login-brand">

        <div class="logo-frame">
          <img
            class="login-logo"
            src="assets/logo.jpg"
            alt="شعار مدرسة البلسم الثانوية"
          >
        </div>

        <div class="brand-title">
          <span>مدرسة</span>
          <strong>البلسم الثانوية</strong>
        </div>

      </div>

      <div class="login-heading">

        <div class="welcome-badge">
          <span></span>
          منصة المدرسة
        </div>

        <h1>مرحباً بك مجدداً</h1>

        <p class="lead">
          سجّل الدخول للوصول إلى حسابك ومتابعة رحلتك التعليمية
        </p>

      </div>

      <form id="loginForm" autocomplete="on">

        <div class="field">

          <label for="studentNo">
            رقم الطالب
          </label>

          <div class="input-wrap">

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
            </svg>

            <input
              id="studentNo"
              name="username"
              type="text"
              inputmode="numeric"
              autocomplete="username"
              placeholder="أدخل رقم الطالب"
              required
            >

          </div>

        </div>

        <div class="field">

          <label for="password">
            كلمة المرور
          </label>

          <div class="input-wrap">

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="4"
                y="10"
                width="16"
                height="11"
                rx="2"
              ></rect>

              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>

            </svg>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="أدخل كلمة المرور"
              required
            >

            <button
              class="eye"
              type="button"
              id="togglePassword"
              aria-label="إظهار كلمة المرور"
              title="إظهار كلمة المرور"
            >

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>

            </button>

          </div>

        </div>

        <div class="login-options">

          <label class="remember">

            <input
              type="checkbox"
              id="remember"
            >

            <span>تذكرني</span>

          </label>

          <button
            type="button"
            class="link-button"
            id="forgot"
          >
            نسيت كلمة المرور؟
          </button>

        </div>

        <button
          class="primary-btn"
          type="submit"
          id="loginButton"
        >

          <span>تسجيل الدخول</span>

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M5 12h13"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>

        </button>

      </form>

      <div class="or">

        <span></span>

        <b>أو</b>

        <span></span>

      </div>

      <button
        class="school-login"
        id="schoolLogin"
        type="button"
      >

        <span class="school-login-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M3 21h18"></path>
            <path d="M5 21V8l7-4 7 4v13"></path>
            <path d="M9 21v-5h6v5"></path>
            <path d="M8 10h1"></path>
            <path d="M12 10h1"></path>
            <path d="M16 10h1"></path>
          </svg>

        </span>

        <span>
          الدخول بحساب المدرسة
        </span>

        <svg
          class="arrow-left"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M19 12H5"></path>
          <path d="m11 6-6 6 6 6"></path>
        </svg>

      </button>

      <div
        class="login-message"
        id="message"
        role="alert"
      ></div>

    </section>

    <footer class="login-footer">

      <p>
        ليس لديك حساب؟
      </p>

      <a
        id="whatsappLink"
        href="#"
        target="_blank"
        rel="noopener"
      >
        <span>تواصل مع إدارة المدرسة</span>

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5Z"></path>
          <path d="M8.5 8.5c.3 2.1 2.1 4 4.1 4.5"></path>
        </svg>

      </a>

      <small>
        مدرسة البلسم الثانوية
      </small>

    </footer>

  </main>

  <script src="js/login.js"></script>

</body>
        </html>
