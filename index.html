<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مدرسة البلسم الثانوية</title>

    <meta name="theme-color" content="#07151d">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginScreen" class="screen login-screen">

    <div class="login-background"></div>

    <div class="login-card">

        <div class="brand-logo">
            <img src="assets/logo.png" alt="شعار مدرسة البلسم">
        </div>

        <div class="brand-title">
            <h1>مدرسة البلسم الثانوية</h1>
            <p>منصة التعليم الذكية</p>
        </div>

        <div class="login-line"></div>

        <form id="loginForm">

            <label for="studentNumber">
                رقم الطالب
            </label>

            <input
                id="studentNumber"
                type="text"
                inputmode="numeric"
                autocomplete="username"
                placeholder="أدخل رقم الطالب"
                required
            >

            <label for="password">
                كلمة المرور
            </label>

            <div class="password-box">

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="أدخل كلمة المرور"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="password-toggle"
                >
                    إظهار
                </button>

            </div>

            <button
                type="submit"
                id="loginButton"
                class="primary-button login-button"
            >
                <span>دخول إلى المنصة</span>
            </button>

            <div id="loginMessage" class="message"></div>

        </form>

        <div class="login-footer">
            <span>مدرسة البلسم الثانوية</span>
            <span>•</span>
            <span>muzamiltaki</span>
        </div>

    </div>

</section>


<!-- ================= APP ================= -->

<section id="appScreen" class="screen app-screen hidden">

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="topbar-brand">

            <img
                src="assets/logo.png"
                alt="شعار المدرسة"
            >

            <div>
                <strong>مدرسة البلسم</strong>
                <small>الثانوية</small>
            </div>

        </div>

        <div id="studentChip" class="student-chip">
            الطالب
        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main id="appContent" class="app-content">
    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            class="nav-button active"
            data-page="home"
        >
            <span>⌂</span>
            <small>الرئيسية</small>
        </button>

        <button
            class="nav-button"
            data-page="library"
        >
            <span>▦</span>
            <small>المكتبة</small>
        </button>

        <button
            class="nav-button"
            data-page="ranking"
        >
            <span>♛</span>
            <small>الترتيب</small>
        </button>

        <button
            class="nav-button"
            data-page="profile"
        >
            <span>◉</span>
            <small>ملفي</small>
        </button>

    </nav>

</section>


<!-- ================= SUPABASE ================= -->

<script src="config.js"></script>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="app.js"></script>

</body>
  </html>
