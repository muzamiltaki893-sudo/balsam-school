<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta
    name="theme-color"
    content="#142338"
  >

  <meta
    name="description"
    content="منصة مدرسة البلسم الثانوية التعليمية"
  >

  <title>مدرسة البلسم الثانوية</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>


<body class="app-page">

  <div class="app-frame">

    <!-- =========================
         الشريط العلوي
         ========================= -->
    <header class="topbar">

      <div class="topbar-info">

        <div class="mini-school">
          مدرسة البلسم الثانوية
        </div>

        <h2 id="pageTitle">
          الرئيسية
        </h2>

      </div>


      <!-- زر الإشعارات -->
      <button
        class="icon-btn"
        id="notifyBtn"
        type="button"
        aria-label="الإشعارات"
        title="الإشعارات"
      >

        <svg
          class="notification-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
          <path d="M10 21h4"></path>
        </svg>

        <b id="notifyCount">0</b>

      </button>

    </header>


    <!-- =========================
         محتوى التطبيق
         ========================= -->
    <main
      id="view"
      class="view"
    ></main>


    <!-- =========================
         شريط التنقل السفلي
         ========================= -->
    <nav
      class="bottom-nav"
      aria-label="التنقل الرئيسي"
    >


      <!-- الرئيسية -->
      <button
        data-tab="home"
        class="nav-item active"
        type="button"
        aria-label="الرئيسية"
      >

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 9.5V21h14V9.5"></path>
            <path d="M9 21v-6h6v6"></path>
          </svg>

        </span>

        <small>الرئيسية</small>

      </button>


      <!-- الاختبارات -->
      <button
        data-tab="tests"
        class="nav-item"
        type="button"
        aria-label="الاختبارات"
      >

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect
              x="4"
              y="3"
              width="16"
              height="18"
              rx="3"
            ></rect>

            <path d="M8 7h8"></path>
            <path d="M8 11h5"></path>
            <path d="M8 15h4"></path>

            <path d="m16 14 1.2 1.2L20 12.5"></path>
          </svg>

        </span>

        <small>الاختبارات</small>

      </button>


      <!-- الملف الشخصي -->
      <button
        data-tab="profile"
        class="nav-item"
        type="button"
        aria-label="الملف الشخصي"
      >

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="12"
              cy="8"
              r="4"
            ></circle>

            <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>

          </svg>

        </span>

        <small>حسابي</small>

      </button>


      <!-- الترتيب -->
      <button
        data-tab="ranking"
        class="nav-item"
        type="button"
        aria-label="الترتيب"
      >

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M8 20V10h3v10H8Z"></path>

            <path d="M14 20V4h3v16h-3Z"></path>

            <path d="M2 20V14h3v6H2Z"></path>

          </svg>

        </span>

        <small>الترتيب</small>

      </button>


    </nav>

  </div>


  <!-- =========================
       النافذة المنبثقة
       ========================= -->
  <div
    class="modal hidden"
    id="modal"
    aria-hidden="true"
  >

    <div
      class="modal-card"
      id="modalContent"
    ></div>

  </div>


  <!-- JavaScript -->
  <script src="js/app.js"></script>

</body>

  </html>
